name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Foundry libs
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-commit

      - name: Autonomy Policy Gate
        env:
          AUTOPILOT_GIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AUTOPILOT_GIT_HEAD: ${{ github.sha }}
        run: pnpm --filter watcher autopilot:policy-gate

      - name: Watcher unit tests
        run: pnpm --filter watcher test

      - name: Replay/backtest gate
        run: pnpm --filter watcher autopilot:replay

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Agent tests
        run: pnpm --filter agent test

      - name: Contracts build
        working-directory: contracts
        run: forge build

      - name: Contracts tests
        run: pnpm --filter contracts test
